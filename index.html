            } else if (window.currentUser && window.currentUser.role === 'siswa') {
                if (window.currentRoute === 'siswa-konfirmasi') {
                    window.loadSiswaSelectMapelView();
                } else if (window.currentRoute === 'siswa-mapel') {

        window.showNotification = function(message) {
            let notif = document.getElementById('toast-notif');
            if (!notif) {
                notif = document.createElement('div'); notif.id = 'toast-notif';
                notif.className = 'fixed top-5 right-5 z-[100] bg-indigo-600 text-white px-6 py-3 rounded-xl shadow-2xl transform transition-all duration-300 -translate-y-20 opacity-0 flex items-center space-x-3 font-bold text-sm border border-indigo-500';
                document.body.appendChild(notif);
            }
            notif.innerHTML = `<i class="fa-solid fa-circle-info text-xl"></i><span>${message}</span>`;
            setTimeout(() => notif.classList.remove('-translate-y-20', 'opacity-0'), 10);
            setTimeout(() => notif.classList.add('-translate-y-20', 'opacity-0'), 4000);
        }

        function formatTanggalIndo(tglStr) {
            if(!tglStr) return '';
            const bulanIndo = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            const d = new Date(tglStr); if(isNaN(d.getTime())) return tglStr;
            return `${d.getDate()} ${bulanIndo[d.getMonth()]} ${d.getFullYear()}`;
        }

        window.switchLoginRole = function(role) {
            ['siswa', 'pengawas', 'admin'].forEach(r => {
                document.getElementById(`tab-${r}-btn`).className = "py-2.5 rounded-xl transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 font-bold uppercase tracking-wider text-[10px]";

            });
            document.getElementById(`tab-${role}-btn`).className = "py-2.5 rounded-xl transition-all bg-indigo-600 text-white shadow-lg font-bold uppercase tracking-wider text-[10px] ring-1 ring-indigo-400/50";
            document.getElementById(`${role}-login-form`)?.classList.remove('hidden');
        }

        window.handleSiswaLogin = async function(e) {
            e.preventDefault(); 
            const username = document.getElementById('siswa-nomor').value.trim();
            const password = document.getElementById('siswa-password').value.trim();
            
            const btnSubmit = e.target.querySelector('button[type="submit"]'); 
            const originalHtml = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memeriksa Data...'; 
            btnSubmit.disabled = true;

            try {
                let foundPeserta = null;
                for (let tk of ['7', '8', '9']) {
                    const db = getDb(tk); 
                    const { data, error } = await db.from('peserta').select('*').eq('username', username).maybeSingle();
                    if (data) { foundPeserta = data; break; }
                }

                if (!foundPeserta) { showNotification('Username tidak ditemukan di Database!'); btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; return; }
                
                // VERIFIKASI PASSWORD
                const dbPassword = foundPeserta.password;
                if (dbPassword) {
                    if (password !== dbPassword) { showNotification('Password salah!'); btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; return; }
                } else {
                    // Jika kolom password di DB masih kosong, gunakan default
                    if (password !== "123456" && password !== username) { showNotification('Password salah! (Gunakan 123456 atau Username)'); btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; return; }
                }

                if (String(foundPeserta.status_blokir || 'AKTIF').toUpperCase() === 'BLOKIR') { showNotification('AKUN ANDA DIBLOKIR! Silakan hubungi pengawas ruang.'); btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; return; }

                window.currentUser = { nomor: username, nama: foundPeserta.nama, tingkat: foundPeserta.tingkat, kelas: foundPeserta.kelas, role: 'siswa' };
                sessionStorage.setItem('cbt_session', JSON.stringify(window.currentUser)); // Simpan Sesi
                window.violationCount = 0; window.loadSiswaSelectMapelView();
            } catch (err) { showNotification('Gagal koneksi ke Server Supabase.'); } finally { btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; }
        }

        window.handlePengawasLogin = function(e) { e.preventDefault(); window.currentUser = { nama: document.getElementById('pengawas-nama').value.trim(), ruang: document.getElementById('pengawas-ruang').value, role: 'pengawas' }; sessionStorage.setItem('cbt_session', JSON.stringify(window.currentUser)); initAppSession(); }
        window.handleAdminLogin = function(e) { e.preventDefault(); if (document.getElementById('admin-username').value.trim() === "admin" && document.getElementById('admin-password').value === "123tek") { window.currentUser = { nama: "Administrator", role: "admin" }; sessionStorage.setItem('cbt_session', JSON.stringify(window.currentUser)); initAppSession(); } else { showNotification('Username atau Password salah!'); } }

            document.getElementById('sidebar').classList.add('hidden'); document.getElementById('sidebar').classList.remove('md:flex'); document.getElementById('mobile-header').classList.add('hidden');
            document.getElementById('siswa-login-form').reset(); document.getElementById('pengawas-login-form').reset(); document.getElementById('admin-login-form').reset(); window.switchLoginRole('siswa');
        }

            const roleText = window.currentUser.role === 'admin' ? 'Administrator' : `Pengawas - ${window.currentUser.ruang}`;
            document.getElementById('sidebar-user-role').innerText = roleText; document.getElementById('mobile-user-role').innerText = roleText;

            const navMenu = document.getElementById('nav-menu'); navMenu.innerHTML = '';
            if (window.currentUser.role === 'admin') {
                const adminLinks = [
                    { id: 'nav-soal', icon: 'fa-book-bookmark', text: 'Bank Soal', action: "loadManajemenSoal('semua')" },
                    { id: 'nav-jadwal', icon: 'fa-calendar-days', text: 'Jadwal & Token', action: 'loadManajemenJadwal()' },

        window.executeGenerateAkunSiswa = async function(e) {
            e.preventDefault();
            const pass = document.getElementById('input-generate-pass').value;
            
            // Cek Password Rahasia
            if (pass !== 'jirolutek') {
                window.showNotification('Gagal: Password Otorisasi Salah!');
                return;
            }
            
            document.getElementById('pass-generate-modal').classList.add('hidden');
            
            const btn = document.getElementById('btn-generate-main'); 
            let originalHtml = '';
            if(btn) {
                originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Proses...'; 
                btn.disabled = true;
            }

            try {
                const tingkatList = ['7', '8', '9'];
                
                for (let tk of tingkatList) {
                    let siswaTingkat = window.appData.peserta.filter(p => String(p.tingkat) === tk);
                    if(siswaTingkat.length === 0) continue;

                    siswaTingkat.sort((a, b) => {
                        if (a.kelas === b.kelas) return (a.nama || '').localeCompare(b.nama || '');
                        return (a.kelas || '').localeCompare(b.kelas || '');
                    });

                    const db = getDb(tk);
                    let updatePromises = [];
                    
                    for(let i = 0; i < siswaTingkat.length; i++) {
                        let s = siswaTingkat[i];
                        let urutan = String(i + 1).padStart(3, '0');
                        let newUsername = `2627${tk.padStart(2, '0')}${urutan}`;
                        
                        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                        let newPassword = '';
                        for(let j=0; j<6; j++) newPassword += chars.charAt(Math.floor(Math.random() * chars.length));

                        s.username = newUsername;
                        s.password = newPassword;

                        updatePromises.push(db.from('peserta').update({ username: newUsername, password: newPassword }).eq('id', s.id));
                    }
                    await Promise.all(updatePromises);
                }
                
                window.showNotification('Proses Generate Akun Berhasil!');
                window.loadDatabasePeserta(window.currentFilterPeserta, true); 
                
            } catch (err) {
                window.showNotification('Terjadi kesalahan saat generate akun: ' + err.message);
            } finally {
                if(btn) {
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                }
            }
        };

        if (chkAll) chkAll.checked = (checkBoxes.length > 0 && checkedCount === checkBoxes.length);

    window.hapusPesertaTerpilih = async function() {
        const checked = document.querySelectorAll('.chk-peserta:checked');
        if(checked.length === 0) return;
        if(!confirm(`Yakin ingin menghapus ${checked.length} siswa yang dipilih secara permanen?`)) return;

        const btn = document.getElementById('btn-hapus-terpilih'); const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghapus...'; btn.disabled = true;

        const toDelete = { '7': [], '8': [], '9': [] };
        checked.forEach(chk => { const parts = chk.value.split('|'); if(parts.length === 2) { toDelete[parts[1]].push(parts[0]); } });

        try {
            for (let tk of ['7', '8', '9']) {
                if (toDelete[tk].length > 0) {
                    const db = getDb(tk); 
                    let { data, error } = await db.from('peserta').delete().in('id', toDelete[tk]).select();
                    if (error) throw error;
                    
                    // PENCARIAN CERDAS (Data Nyasar di Server 7)
                    if ((!data || data.length < toDelete[tk].length) && db !== sbClient7) {
                        const fallback = await sbClient7.from('peserta').delete().in('id', toDelete[tk]).eq('tingkat', tk).select();
                        if (fallback.error) throw fallback.error;
                        if (fallback.data) data = data ? [...data, ...fallback.data] : fallback.data;
                    }
                    
                    if (!data || data.length === 0) throw new Error("Akses ditolak oleh Server (RLS belum dinonaktifkan).");
                }
            }
            showNotification(`${checked.length} Siswa berhasil dihapus.`); window.loadDatabasePeserta(window.currentFilterPeserta, true);
        } catch(err) {
            showNotification('Gagal menghapus: ' + err.message); btn.innerHTML = originalHtml; btn.disabled = false;
            window.loadDatabasePeserta(window.currentFilterPeserta, true);
        }
    };

    window.loadDatabasePeserta = function(filterTingkat = 'semua', forceRefresh = false) {
        window.currentRoute = 'peserta'; window.currentFilterPeserta = filterTingkat;
        
        let sortedData = [...window.appData.peserta].sort((a, b) => {
            if (a.kelas === b.kelas) return (a.nama || '').localeCompare(b.nama || '');
            return (a.kelas || '').localeCompare(b.kelas || '');
        });

        let currentData = sortedData;
        if (filterTingkat === 'terblokir') {
            currentData = sortedData.filter(p => String(p.status_blokir || 'AKTIF').toUpperCase() === 'BLOKIR');
        } else if (filterTingkat !== 'semua') {
            currentData = sortedData.filter(p => String(p.tingkat) === filterTingkat);
        }

        window.renderPesertaUI(currentData, filterTingkat, !window.appData.isFetched.peserta || forceRefresh);

        if (!window.appData.isFetched.peserta || forceRefresh) {
            const queries = [sbClient7.from('peserta').select('*')];
            if (sbClient8 !== sbClient7) queries.push(sbClient8.from('peserta').select('*'));
            if (sbClient9 !== sbClient7) queries.push(sbClient9.from('peserta').select('*'));

            Promise.allSettled(queries).then(results => {
                let newData = [];

        window.handleUpdateSoal = async function(e, id, oldTingkat) {
            e.preventDefault(); 
            const btn = e.target.querySelector('button'); btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...'; btn.disabled = true;
            const tk = document.getElementById('edit-soal-tingkat').value;
            const payload = { tingkat: tk, mapel: document.getElementById('edit-soal-mapel').value, pertanyaan: document.getElementById('edit-soal-tanya').value, pilihan_a: document.getElementById('edit-soal-a').value, pilihan_b: document.getElementById('edit-soal-b').value, pilihan_c: document.getElementById('edit-soal-c').value, pilihan_d: document.getElementById('edit-soal-d').value, kunci: document.getElementById('edit-soal-kunci').value, skor: parseInt(document.getElementById('edit-soal-skor').value) || 2 };
            
            try { 
                if(oldTingkat === tk) { 
                    let db = getDb(tk); 
                    let { data, error } = await db.from('soal').update(payload).eq('id', id).select(); 
                    if(error) throw error; 
                    
                    // Fallback (Pencarian Cerdas) jika data nyasar di Server 7
                    if((!data || data.length === 0) && db !== sbClient7) {
                        const fb = await sbClient7.from('soal').update(payload).eq('id', id).select();
                        data = fb.data; error = fb.error; if(error) throw error;
                    }
                    if(!data || data.length === 0) throw new Error("Akses ditolak (RLS).");
                } else { 
                    // Menghapus data di server lama dan memindahkannya ke server baru
                    let dbOld = getDb(oldTingkat); 
                    let { data: dataOld, error: errOld } = await dbOld.from('soal').delete().eq('id', id).select(); 
                    if(errOld) throw errOld;
                    
                    if((!dataOld || dataOld.length === 0) && dbOld !== sbClient7) {
                        const fb = await sbClient7.from('soal').delete().eq('id', id).select();
                        dataOld = fb.data; errOld = fb.error; if(errOld) throw errOld;
                    }
                    if(!dataOld || dataOld.length === 0) throw new Error("Gagal menghapus soal lama.");
                    
                    const dbNew = getDb(tk); 
                    const { error: errNew } = await dbNew.from('soal').insert([payload]); 
                    if (errNew) throw errNew;
                }
                document.getElementById('edit-soal-modal').classList.add('hidden'); 
                window.loadManajemenSoal(window.currentFilterTingkat, true); 
                showNotification("Soal berhasil diperbarui!");
            } catch(err) { 
                showNotification(`Gagal: ${err.message}`); window.loadManajemenSoal(window.currentFilterTingkat, true); 
            } finally { 
                btn.innerHTML = 'Simpan Perubahan'; btn.disabled = false; 
            }
        };

        window.handleExcelImportSoal = function(e) {

                    const inserts = { '7': [], '8': [], '9': [] };
                    for(let r of json) { 
                        const tk = String(r.tingkat||"7").trim(); 
                        if (['7','8','9'].includes(tk) && r.pertanyaan && r.kunci) { 
                            inserts[tk].push({ tingkat: tk, mapel: r.mapel||'Umum', pertanyaan: r.pertanyaan, pilihan_a: r.pilihan_a||'', pilihan_b: r.pilihan_b||'', pilihan_c: r.pilihan_c||'', pilihan_d: r.pilihan_d||'', kunci: r.kunci, skor: parseInt(r.skor)||2 }); 
                        } 
                    }
                    if(inserts['7'].length) await sbClient7.from('soal').insert(inserts['7']); 
                    if(inserts['8'].length) await sbClient8.from('soal').insert(inserts['8']); 
                    if(inserts['9'].length) await sbClient9.from('soal').insert(inserts['9']);
                    window.loadManajemenSoal(window.currentFilterTingkat, true); showNotification(`Import soal sukses!`);
                } catch(err) { showNotification('Gagal import. Periksa format Excel.'); }
            }; reader.readAsArrayBuffer(file);
        };

        window.updateBtnHapusJadwalTerpilih = function() {
            const checkBoxes = document.querySelectorAll('.chk-jadwal'); const checkedCount = document.querySelectorAll('.chk-jadwal:checked').length;
            const btn = document.getElementById('btn-hapus-jadwal'); const chkAll = document.getElementById('chk-all-jadwal');

        window.hapusJadwalTerpilih = async function() {
            const checked = document.querySelectorAll('.chk-jadwal:checked'); if(checked.length === 0) return;
            if(!confirm(`Yakin ingin menghapus ${checked.length} jadwal yang dipilih?`)) return;
            const btn = document.getElementById('btn-hapus-jadwal'); const originalHtml = btn.innerHTML; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghapus...'; btn.disabled = true;
            const toDelete = { '7': [], '8': [], '9': [] };
            checked.forEach(chk => { const parts = chk.value.split('|'); if(parts.length === 2) { toDelete[parts[1]].push(parts[0]); } });
            try {
                for (let tk of ['7', '8', '9']) {
                    if (toDelete[tk].length > 0) {
                        const db = getDb(tk); let { data, error } = await db.from('jadwal').delete().in('id', toDelete[tk]).select();
                        if (error) throw error;
                        if ((!data || data.length < toDelete[tk].length) && db !== sbClient7) {
                            const fallback = await sbClient7.from('jadwal').delete().in('id', toDelete[tk]).eq('tingkat', tk).select();
                            if (fallback.error) throw fallback.error;
                            if (fallback.data) data = data ? [...data, ...fallback.data] : fallback.data;
                        }
                        if (!data || data.length === 0) throw new Error("Akses ditolak (RLS).");
                    }
                }
                showNotification(`${checked.length} Jadwal berhasil dihapus.`); window.loadManajemenJadwal(true);
            } catch(err) { showNotification('Gagal menghapus: ' + err.message); btn.innerHTML = originalHtml; btn.disabled = false; window.loadManajemenJadwal(true); }
        };

        window.loadManajemenJadwal = function(forceRefresh = false) {
            window.currentRoute = 'jadwal'; window.renderJadwalUI(!window.appData.isFetched.jadwal || forceRefresh);
            if (!window.appData.isFetched.jadwal || forceRefresh) {
                const queries = [sbClient7.from('jadwal').select('*')];
                if (sbClient8 !== sbClient7) queries.push(sbClient8.from('jadwal').select('*'));
                if (sbClient9 !== sbClient7) queries.push(sbClient9.from('jadwal').select('*'));
                Promise.allSettled(queries).then(results => {
                    let newData = []; results.forEach(res => { if(res.status === 'fulfilled' && res.value.data) newData.push(...res.value.data); });
                    window.appData.jadwal = newData; window.appData.isFetched.jadwal = true;
                    if (window.currentRoute === 'jadwal') window.renderJadwalUI(false);
                });
            }
        };

    window.handleUpdateExam = async function(e, id, oldTingkat) {
        e.preventDefault(); const btn = e.target.querySelector('button'); btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...'; btn.disabled = true;
        const tk = document.getElementById('edit-exam-tingkat').value; const dt = new Date(document.getElementById('edit-exam-date').value);
        const payload = { hari: ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][dt.getDay()], tanggal: document.getElementById('edit-exam-date').value, mapel: document.getElementById('edit-exam-mapel').value, tingkat: tk, durasi: parseInt(document.getElementById('edit-exam-durasi').value)||90, token: document.getElementById('edit-exam-token').value.trim().toUpperCase(), status: document.getElementById('edit-exam-status').value };
        
        try { 
            if(oldTingkat === tk) { 
                let db = getDb(tk); 
                let { data, error } = await db.from('jadwal').update(payload).eq('id', id).select(); 
                if(error) throw error; 
                // PENCARIAN CERDAS: Cari di Server 7 jika tidak ketemu
                if((!data || data.length === 0) && db !== sbClient7) {
                    const fb = await sbClient7.from('jadwal').update(payload).eq('id', id).select();
                    data = fb.data; error = fb.error; if(error) throw error;
                }
                if(!data || data.length === 0) throw new Error("Akses ditolak oleh Server (RLS).");
            } else { 
                let dbOld = getDb(oldTingkat); 
                let { data: dataOld, error: errOld } = await dbOld.from('jadwal').delete().eq('id', id).select(); 
                if(errOld) throw errOld;
                if((!dataOld || dataOld.length === 0) && dbOld !== sbClient7) {
                    const fb = await sbClient7.from('jadwal').delete().eq('id', id).select();
                    dataOld = fb.data; errOld = fb.error; if(errOld) throw errOld;
                }
                if(!dataOld || dataOld.length === 0) throw new Error("Gagal menghapus jadwal lama (Akses ditolak RLS).");
                
                const dbNew = getDb(tk); 
                const { error: errNew } = await dbNew.from('jadwal').insert([payload]); 
                if (errNew) throw errNew;
            }
            document.getElementById('edit-exam-modal').classList.add('hidden'); 
            window.loadManajemenJadwal(true); 
            showNotification("Perubahan Jadwal berhasil disimpan!");
        } catch(err) { showNotification(`Gagal: ${err.message}`); window.loadManajemenJadwal(true); } finally { btn.innerHTML = 'Simpan Perubahan'; btn.disabled = false; }
    };

lass="p-4 text-center">Nilai Akhir</th></tr></thead><tbody class="divide-y divide-slate-800/60">`;

    window.hapusHasilTerpilih = async function() {
        const checked = document.querySelectorAll('.chk-hasil:checked');
        if(checked.length === 0) return;
        if(!confirm(`Yakin ingin menghapus ${checked.length} data nilai yang dipilih secara permanen?`)) return;

        const btn = document.getElementById('btn-hapus-hasil'); const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghapus...'; btn.disabled = true;

        const toDelete = { '7': [], '8': [], '9': [] };
        checked.forEach(chk => { const parts = chk.value.split('|'); if(parts.length === 2) { toDelete[parts[1]].push(parts[0]); } });

        try {
            for (let tk of ['7', '8', '9']) {
                if (toDelete[tk].length > 0) {
                    const db = getDb(tk); 
                    let { data, error } = await db.from('hasil').delete().in('id', toDelete[tk]).select();
                    if (error) throw error;
                    
                    // PENCARIAN CERDAS (Data Nyasar di Server 7)
                    if ((!data || data.length < toDelete[tk].length) && db !== sbClient7) {
                        const fallback = await sbClient7.from('hasil').delete().in('id', toDelete[tk]).eq('tingkat', tk).select();
                        if (fallback.error) throw fallback.error;
                        if (fallback.data) data = data ? [...data, ...fallback.data] : fallback.data;
                    }

                    if (!data || data.length === 0) throw new Error("Akses ditolak oleh Server (RLS).");
                }
            }
            showNotification(`${checked.length} Data Nilai berhasil dihapus.`); window.loadRekapNilai(window.currentFilterTingkat, true);
        } catch(err) {
            showNotification('Gagal menghapus: ' + err.message); btn.innerHTML = originalHtml; btn.disabled = false;
            window.loadRekapNilai(window.currentFilterTingkat, true);
        }
    };

    window.loadRekapNilai = function(filterTingkat = 'semua', forceRefresh = false) {
            window.currentRoute = 'hasil'; window.currentFilterTingkat = filterTingkat;
            let currentData = filterTingkat === 'semua' ? window.appData.hasil : window.appData.hasil.filter(h => String(h.tingkat) === filterTingkat);
            window.renderHasilUI(currentData, filterTingkat, !window.appData.isFetched.hasil || forceRefresh);

            if (!window.appData.isFetched.hasil || forceRefresh) {
                const queries = [sbClient7.from('hasil').select('*')];
                if (sbClient8 !== sbClient7) queries.push(sbClient8.from('hasil').select('*'));
                if (sbClient9 !== sbClient7) queries.push(sbClient9.from('hasil').select('*'));

                Promise.allSettled(queries).then(results => {
                    let newData = []; results.forEach(res => { if(res.status === 'fulfilled' && res.value.data) newData.push(...res.value.data); });
                    window.appData.hasil = newData; window.appData.isFetched.hasil = true;
                    if (window.currentRoute === 'hasil') {
                        let filtered = filterTingkat === 'semua' ? window.appData.hasil : window.appData.hasil.filter(h => String(h.tingkat) === filterTingkat);
                        window.renderHasilUI(filtered, filterTingkat, false);
                    }
                });
            }
        };

            container.innerHTML = `<div class="glass-card-dark p-4 rounded-2xl border border-slate-800 mb-6 flex justify-between items-center sticky top-0 z-40 backdrop-blur-3xl shadow-lg"><div><h2 class="font-extrabold text-indigo-300 text-sm md:text-base truncate max-w-[150px] md:max-w-none">${window.currentUser.mapel}</h2><p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider hidden sm:block">${window.currentUser.nama} &bull; ${window.currentUser.kelas}</p></div><div class="flex items-center space-x-3 bg-red-500/10 border border-red-500/30 px-4 md:px-5 py-2 md:py-2.5 rounded-xl shadow-inner w-auto"><i class="fa-regular fa-clock text-red-400 text-xl animate-pulse"></i><div><div class="text-[8px] md:text-[9px] text-red-300 uppercase font-bold tracking-widest">Sisa Waktu</div><div id="cbt-timer" class="font-mono text-lg md:text-2xl font-black text-white">00:00:00</div></div></div></div><div class="grid grid-cols-1 lg:grid-cols-4 gap-6 relative"><div class="lg:col-span-3 flex flex-col"><div class="glass-card-dark rounded-2xl border border-slate-800 flex flex-col min-h-[400px] shadow-lg flex-1 relative overflow-hidden"><div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div><div class="bg-slate-900/80 px-4 sm:px-6 py-4 border-b border-slate-800 flex justify-between items-center"><span class="text-[10px] md:text-xs font-black bg-indigo-600 px-4 py-1.5 rounded-lg text-white tracking-widest shadow-md" id="display-num-title">SOAL 1</span><span class="text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest">Pilihan Ganda</span></div><div class="p-4 sm:p-6 md:p-8 flex-grow space-y-6 sm:space-y-8"><div id="question-text" class="text-white text-sm sm:text-base font-medium leading-relaxed select-none overflow-x-auto"></div><div id="options-container" class="space-y-3"></div></div><div class="bg-slate-900/80 px-4 sm:px-6 py-4 rounded-b-2xl flex flex-wrap sm:flex-nowrap justify-between gap-3 border-t border-slate-800"><button id="btn-prev" onclick="window.prevSoal()" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-slate-300 font-bold px-4 py-3 sm:py-3.5 rounded-xl text-[10px] sm:text-xs transition"><i class="fa-solid fa-chevron-left mr-2"></i>SEBELUMNYA</button><label class="w-full sm:w-auto flex items-center justify-center space-x-2 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 font-bold px-4 py-3 sm:py-3.5 rounded-xl cursor-pointer border border-amber-500/30 text-[10px] sm:text-xs transition"><input type="checkbox" id="chk-ragu" onchange="window.toggleRagu()" class="w-4 h-4 text-amber-500 rounded"><i class="fa-solid fa-flag"></i><span>RAGU-RAGU</span></label><button id="btn-next" onclick="window.nextSoal()" class="w-full sm:w-auto gradient-btn text-white font-bold px-5 py-3 sm:py-3.5 rounded-xl text-[10px] sm:text-xs shadow-lg"><span id="next-text">BERIKUTNYA</span><i class="fa-solid fa-chevron-right ml-2" id="next-icon"></i></button></div></div></div><div class="lg:col-span-1"><div class="glass-card-dark rounded-2xl border border-slate-800 p-5 flex flex-col h-full sticky top-[100px] shadow-lg"><h4 class="font-black text-white text-[11px] uppercase tracking-widest mb-4 border-b border-slate-800 pb-3 flex items-center"><i class="fa-solid fa-th text-indigo-500 mr-2 text-sm"></i>Navigasi Soal</h4><div id="navigation-grid" class="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-5 gap-2 overflow-y-auto pr-1 max-h-[30vh] lg:max-h-[50vh] scrollbar-hide mb-4"></div><div class="mt-auto pt-4 border-t border-slate-800"><button onclick="window.confirmFinishExam()" class="w-full bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-xl text-[11px] uppercase tracking-widest shadow-[0_5px_20px_rgba(220,38,38,0.3)] transition transform hover:-translate-y-1">Kumpulkan</button></div></div></div></div>`;
            const jdwl = window.appData.jadwal.find(j => j.mapel===window.currentUser.mapel && j.tingkat===window.currentUser.tingkat && j.status==='Aktif');
            startCbtCountdown((jdwl && jdwl.durasi ? parseInt(jdwl.durasi) : 90) * 60); window.renderCbtQuestion(0);
        };

        window.renderCbtQuestion = function(idx) {
            window.currentQuestionIndex = idx; const q = window.appData.soal[idx]; const isLast = idx === window.appData.soal.length - 1;
            if(!q) return; document.getElementById('display-num-title').innerText = `SOAL NO. ${idx + 1}`; document.getElementById('question-text').innerHTML = q.pertanyaan;
            const opts = document.getElementById('options-container'); opts.innerHTML = '';
            ['A','B','C','D'].forEach((key, i) => {
                const txt = [q.pilihan_a, q.pilihan_b, q.pilihan_c, q.pilihan_d][i]; if(!txt) return; const isSel = window.studentAnswers[idx] === key;
                opts.innerHTML += `<div><input type="radio" id="opt-${key}" class="hidden" ${isSel?'checked':''} onchange="window.selectCbtAnswer('${key}')"><label for="opt-${key}" class="flex items-start p-3 sm:p-4 rounded-xl border ${isSel?'border-indigo-500 bg-indigo-600/20 shadow-[0_0_15px_rgba(99,102,241,0.2)]':'border-slate-800 bg-slate-900/60 hover:bg-slate-800/80'} cursor-pointer transition-all overflow-x-auto"><span class="w-8 h-8 flex items-center justify-center font-bold rounded-lg mr-3 sm:mr-4 text-xs shrink-0 mt-0.5 ${isSel?'bg-indigo-600 text-white':'bg-slate-800 text-slate-400'}">${key}</span><span class="text-slate-200 text-sm font-medium select-none break-words w-full pt-1.5">${txt}</span></label></div>`;
            });
            document.getElementById('chk-ragu').checked = !!window.studentRagu[idx]; document.getElementById('btn-prev').disabled = idx === 0;
            const nbText = document.getElementById('next-text'), nbIcon = document.getElementById('next-icon'), nb = document.getElementById('btn-next');
            if(isLast) { nbText.innerText='SELESAI'; nbIcon.className='fa-solid fa-flag-checkered ml-2'; nb.className='bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-3 sm:py-3.5 rounded-xl text-[10px] sm:text-xs shadow-lg transition w-full sm:w-auto'; } 
            else { nbText.innerText='BERIKUTNYA'; nbIcon.className='fa-solid fa-chevron-right ml-2'; nb.className='gradient-btn text-white font-bold px-5 py-3 sm:py-3.5 rounded-xl text-[10px] sm:text-xs shadow-lg w-full sm:w-auto'; }
            window.renderCbtGridNav();
        };

        window.selectCbtAnswer = function(key) { window.studentAnswers[window.currentQuestionIndex] = key; window.renderCbtQuestion(window.currentQuestionIndex); };
        window.toggleRagu = function() { window.studentRagu[window.currentQuestionIndex] = document.getElementById('chk-ragu').checked; window.renderCbtGridNav(); };
        window.prevSoal = function() { if(window.currentQuestionIndex > 0) window.renderCbtQuestion(window.currentQuestionIndex-1); };
        window.nextSoal = function() { if(window.currentQuestionIndex < window.appData.soal.length-1) window.renderCbtQuestion(window.currentQuestionIndex+1); else window.confirmFinishExam(); };
        
        function renderCbtGridNav() {
            const grid = document.getElementById('navigation-grid'); if(!grid) return; grid.innerHTML = '';
            window.appData.soal.forEach((_, idx) => {
                const isCurr = idx===window.currentQuestionIndex, isAns = window.studentAnswers[idx]!==undefined, isRagu = window.studentRagu[idx];
                let cls = "bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800";
                if(isAns&&!isRagu) cls = "bg-emerald-500 text-white border-emerald-600 shadow-[0_0_10px_rgba(16,185,129,0.3)]"; if(isRagu) cls = "bg-amber-400 text-amber-900 border-amber-500 shadow-[0_0_10px_rgba(251,191,36,0.3)]"; if(isCurr) cls += " ring-2 ring-white transform scale-110 z-10";
                grid.innerHTML += `<button onclick="window.renderCbtQuestion(${idx})" class="w-full aspect-square rounded-lg text-[10px] sm:text-xs font-black flex items-center justify-center transition-all border ${cls}">${idx+1}</button>`;
            });
        }

        function startCbtCountdown(sec) {
            let t=sec; const d=document.getElementById('cbt-timer'); if(window.examTimerInterval) clearInterval(window.examTimerInterval);
            window.examTimerInterval = setInterval(() => {
                if(d) { d.textContent = `${String(Math.floor(t/3600)).padStart(2,'0')}:${String(Math.floor((t%3600)/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`; if(t<=300) d.className='font-mono text-lg md:text-2xl font-black text-red-500 animate-pulse'; }
                if(--t<0) { clearInterval(window.examTimerInterval); showNotification("Waktu Habis!"); window.submitExamFinal(true); }
            }, 1000);
        }

        window.confirmFinishExam = function() {
            const jdwl = window.appData.jadwal.find(j => j.mapel===window.currentUser.mapel && j.tingkat===window.currentUser.tingkat && j.status==='Aktif');
            const ansCount = Object.keys(window.studentAnswers).length, unans = window.appData.soal.length - ansCount;
            let modal = document.getElementById('sub-exam');
            if(!modal) { modal=document.createElement('div'); modal.id='sub-exam'; modal.className='fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/90 p-4'; document.body.appendChild(modal); }
            modal.innerHTML = `<div class="glass-card-dark p-6 md:p-8 rounded-3xl max-w-sm w-full border border-slate-700 text-center shadow-[0_0_50px_rgba(0,0,0,0.5)]"><div class="w-20 h-20 bg-amber-500/20 text-amber-500 rounded-full flex mx-auto text-4xl mb-6 items-center justify-center shadow-inner"><i class="fa-solid fa-exclamation-triangle"></i></div><h3 class="text-2xl font-black text-white mb-2">Selesai Ujian?</h3><p class="text-sm text-slate-300">Menjawab <b class="text-indigo-400">${ansCount}</b> dari <b class="text-indigo-400">${window.appData.soal.length}</b> soal.</p>${unans>0?`<p class="text-red-400 font-bold mb-4 mt-2 text-xs uppercase tracking-widest"><i class="fa-solid fa-circle-xmark mr-1"></i> Kosong: ${unans}</p>`:''}<div class="my-6 text-left"><label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest text-center">Token Pengawas</label><input type="text" id="sub-token" placeholder="-----" class="w-full px-4 py-4 rounded-xl glass-input text-center text-xl font-black uppercase text-amber-400 tracking-[0.5em] placeholder-slate-600"></div><div class="flex gap-3"><button onclick="document.getElementById('sub-exam').classList.add('hidden')" class="flex-1 py-4 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-[10px] uppercase tracking-widest transition">Batal</button><button onclick="window.validateTokenAndSubmit('${jdwl?jdwl.token:''}')" class="flex-1 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-[10px] uppercase tracking-widest shadow-[0_5px_15px_rgba(16,185,129,0.3)] transition transform hover:-translate-y-1">Kumpulkan</button></div></div>`;
            modal.classList.remove('hidden'); document.getElementById('sub-token').focus();
        };

        window.validateTokenAndSubmit = function(reqTok) { const inp = document.getElementById('sub-token').value.trim().toUpperCase(); if(reqTok && inp!==reqTok) return showNotification('Token Pengawas Salah!'); document.getElementById('sub-exam').classList.add('hidden'); window.submitExamFinal(false); };
        window.submitExamFinal = async function(isAuto) {
            window.isExamActive = false; if(window.examTimerInterval) clearInterval(window.examTimerInterval);
            if(!window.currentUser || !window.currentUser.mapel) { const container = document.getElementById('content-container'); container.innerHTML = `<div class="glass-card-dark p-8 rounded-3xl text-center max-w-lg mx-auto space-y-6 mt-10 border border-red-500/30"><div class="text-red-400 font-bold">Sesi Anda telah berakhir atau terputus. Silakan hubungi Admin.</div><button onclick="window.handleLogout()" class="w-full py-4 bg-slate-800 text-white font-bold rounded-xl text-xs uppercase tracking-widest">Logout</button></div>`; return; }
            
            let n = 0; 
            window.appData.soal.forEach((q, i) => { 
                if(window.studentAnswers[i]===q.kunci) { 
                    n += parseInt(q.skor || 2); 
                } 
            });
            
            const container = document.getElementById('content-container'); 
            container.innerHTML = `<div class="glass-card-dark p-8 md:p-12 rounded-3xl text-center max-w-lg mx-auto space-y-6 mt-10"><i class="fa-solid fa-circle-notch fa-spin text-5xl text-indigo-500 mb-4 block"></i><h2 class="text-xl font-bold text-white">Menyimpan Hasil Ujian...</h2><p class="text-sm text-slate-400">Mohon tunggu, nilai sedang dikirim ke server.</p></div>`;

            try { 
                const db = getDb(window.currentUser.tingkat); 
                const { error } = await db.from('hasil').insert([{ nama: window.currentUser.nama, kelas: window.currentUser.kelas, tingkat: window.currentUser.tingkat, mapel: window.currentUser.mapel, nilai: n, timestamp: new Date().toISOString() }]); 
                if (error) throw error;
                
                container.innerHTML = `<div class="glass-card-dark p-8 md:p-12 rounded-3xl text-center max-w-lg mx-auto space-y-6 mt-10 shadow-[0_0_50px_rgba(16,185,129,0.2)] border border-emerald-500/20"><div class="w-24 h-24 bg-emerald-500 text-white rounded-full flex items-center justify-center mx-auto text-5xl shadow-[0_10px_30px_rgba(16,185,129,0.4)] mb-2"><i class="fa-solid fa-check"></i></div><h2 class="text-2xl md:text-3xl font-black text-white tracking-wide">Ujian Selesai!</h2><p class="text-sm text-slate-300 leading-relaxed">Jawaban ujian Anda telah berhasil disimpan di server pusat.</p><div class="pt-4 border-t border-slate-800"><button onclick="window.handleLogout()" class="w-full py-4 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-[11px] uppercase tracking-widest transition">Keluar Sesi</button></div></div>`; 
            } catch(e) { 
                container.innerHTML = `<div class="glass-card-dark p-8 md:p-12 rounded-3xl text-center max-w-lg mx-auto space-y-6 mt-10 border border-red-500/50 shadow-[0_0_50px_rgba(239,68,68,0.2)]"><div class="w-24 h-24 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto text-5xl border border-red-500/30 mb-2"><i class="fa-solid fa-xmark"></i></div><h2 class="text-2xl md:text-3xl font-black text-white tracking-wide">Gagal Menyimpan!</h2><p class="text-sm text-slate-300 leading-relaxed">Sistem ditolak oleh server: ${e.message}</p><div class="pt-4 border-t border-slate-800 flex gap-3"><button onclick="window.submitExamFinal(false)" class="w-full py-4 gradient-btn text-white font-bold rounded-xl text-[11px] uppercase tracking-widest transition shadow-lg"><i class="fa-solid fa-rotate-right mr-2"></i>Coba Kirim Ulang</button></div></div>`;
            }
        };

        window.loadPengawasMode = function() {
            window.currentRoute = 'pengawas-ba'; window.isExamActive = false; const container = document.getElementById('content-container');
            container.innerHTML = `<div class="mb-8"><h1 class="text-2xl md:text-3xl font-extrabold text-white">Berita Acara Pengawas</h1><p class="text-sm text-slate-400 mt-1">Laporan disinkronisasikan langsung ke Server Master Admin</p></div><form onsubmit="window.simpanBeritaAcara(event)" class="glass-card-dark p-6 md:p-8 rounded-3xl border border-slate-800 space-y-6 max-w-4xl shadow-xl"><div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm"><div><label class="block font-bold text-slate-400 mb-1.5 text-xs">Mata Pelajaran</label><select id="ba-mapel" required class="w-full px-4 py-3 rounded-xl glass-input bg-slate-900">${window.listMapel.map(m=>`<option value="${m}">${m}</option>`).join('')}</select></div><div><label class="block font-bold text-slate-400 mb-1.5 text-xs">Tanggal Pelaksanaan</label><input type="date" id="ba-tanggal" required value="${new Date().toISOString().split('T')[0]}" class="w-full px-4 py-3 rounded-xl glass-input"></div><div><label class="block font-bold text-slate-400 mb-1.5 text-xs">Ruang Ujian</label><input type="text" id="ba-ruang" required value="${window.currentUser.ruang}" class="w-full px-4 py-3 rounded-xl glass-input font-bold text-slate-200 bg-slate-800/50" readonly></div><div><label class="block font-bold text-slate-400 mb-1.5 text-xs">Nama Pengawas Lengkap</label><input type="text" id="ba-pengawas" required value="${window.currentUser.nama}" class="w-full px-4 py-3 rounded-xl glass-input text-slate-200"></div><div class="md:col-span-2 border-t border-slate-800 pt-6"><h3 class="font-bold text-emerald-400 mb-4 text-xs uppercase tracking-widest"><i class="fa-solid fa-users mr-2"></i> Rincian Kehadiran</h3><div class="grid grid-cols-2 md:grid-cols-5 gap-4"><div><label class="block text-slate-400 text-[10px] uppercase font-bold mb-1.5">Total</label><input type="number" id="ba-total" value="32" class="w-full px-4 py-3 rounded-xl glass-input text-center text-lg font-bold" onchange="window.hitungHadirOtomatis()"></div><div><label class="block text-amber-400 text-[10px] uppercase font-bold mb-1.5">Sakit</label><input type="number" id="ba-sakit" value="0" class="w-full px-4 py-3 rounded-xl glass-input text-center text-lg font-bold" onchange="window.hitungHadirOtomatis()"></div><div><label class="block text-blue-400 text-[10px] uppercase font-bold mb-1.5">Izin</label><input type="number" id="ba-izin" value="0" class="w-full px-4 py-3 rounded-xl glass-input text-center text-lg font-bold" onchange="window.hitungHadirOtomatis()"></div><div><label class="block text-red-400 text-[10px] uppercase font-bold mb-1.5">Alpha</label><input type="number" id="ba-alpha" value="0" class="w-full px-4 py-3 rounded-xl glass-input text-center text-lg font-bold" onchange="window.hitungHadirOtomatis()"></div><div><label class="block text-emerald-400 text-[10px] uppercase font-bold mb-1.5">Hadir</label><input type="number" id="ba-hadir" value="32" class="w-full px-4 py-3 rounded-xl glass-input border-emerald-500/50 bg-emerald-500/10 text-emerald-300 text-center text-lg font-black" readonly></div></div></div><div class="md:col-span-2"><label class="block font-bold text-slate-400 mb-1.5 text-xs">Nama Peserta Tidak Hadir (Jika Ada)</label><textarea id="ba-nama-absen" rows="2" placeholder="Tuliskan nama atau nomor peserta yang tidak hadir..." class="w-full px-4 py-3 rounded-xl glass-input text-slate-200"></textarea></div><div class="md:col-span-2 bg-slate-900/60 p-5 rounded-2xl text-center border border-slate-800"><label class="block font-black text-slate-300 mb-4 text-[11px] uppercase tracking-widest"><i class="fa-solid fa-pen-nib mr-2"></i> Tanda Tangan Pengawas</label><div class="bg-white rounded-xl p-1 max-w-[400px] mx-auto shadow-inner"><canvas id="signature-pad" class="w-full h-40 touch-none rounded-lg cursor-crosshair"></canvas></div><button type="button" onclick="window.signaturePadInstance.clear()" class="mt-3 text-[10px] text-slate-500 hover:text-slate-300 font-bold uppercase tracking-widest"><i class="fa-solid fa-eraser mr-1"></i> Bersihkan Area</button></div><div class="md:col-span-2 pt-4"><button type="submit" class="w-full py-4 gradient-btn text-white font-black rounded-xl text-xs uppercase tracking-widest shadow-xl"><i class="fa-solid fa-paper-plane mr-2"></i> Kirim Laporan ke Admin</button></div></div></form>`;
            setTimeout(() => { const cvs = document.getElementById('signature-pad'); if(cvs){ cvs.width=cvs.offsetWidth; cvs.height=cvs.offsetHeight; window.signaturePadInstance = new SignaturePad(cvs,{backgroundColor:'rgb(255,255,255)', penColor: 'rgb(0,0,0)'}); } }, 300);
        };
        window.hitungHadirOtomatis = function() { document.getElementById('ba-hadir').value = Math.max(0, parseInt(document.getElementById('ba-total').value||0) - (parseInt(document.getElementById('ba-sakit').value||0) + parseInt(document.getElementById('ba-izin').value||0) + parseInt(document.getElementById('ba-alpha').value||0))); };
        window.simpanBeritaAcara = async function(e) {
            e.preventDefault(); const btn = e.target.querySelector('button'); btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengirim Laporan...';
            if(!window.signaturePadInstance || window.signaturePadInstance.isEmpty()) { showNotification("Tanda tangan wajib diisi!"); btn.innerHTML='<i class="fa-solid fa-paper-plane mr-2"></i> Kirim Laporan ke Admin'; btn.disabled=false; return; }
            try { const { error } = await sbClient7.from('berita_acara').insert([{ hari: ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][new Date(document.getElementById('ba-tanggal').value).getDay()], tanggalpelaksanaan: document.getElementById('ba-tanggal').value, ruang: document.getElementById('ba-ruang').value, pengawas: document.getElementById('ba-pengawas').value, mapel: document.getElementById('ba-mapel').value, total: parseInt(document.getElementById('ba-total').value)||0, hadir: parseInt(document.getElementById('ba-hadir').value)||0, sakit: parseInt(document.getElementById('ba-sakit').value)||0, izin: parseInt(document.getElementById('ba-izin').value)||0, alpha: parseInt(document.getElementById('ba-alpha').value)||0, namaabsen: document.getElementById('ba-nama-absen').value, signaturedata: window.signaturePadInstance.toDataURL() }]); if (error) throw error; showNotification('Laporan sukses terkirim!'); window.loadPengawasMode(); } catch(e){ showNotification(`Gagal mengirim: ${e.message}`); } finally { btn.innerHTML='<i class="fa-solid fa-paper-plane mr-2"></i> Kirim Laporan ke Admin'; btn.disabled=false; }
        };

    </script>
</head>

                    <h1 id="app-header-title" class="text-xl md:text-2xl font-black text-white uppercase tracking-wider bg-gradient-to-r from-white via-indigo-200 to-indigo-400 bg-clip-text text-transparent">CBT PANESA</h1>
                    <div class="inline-flex items-center px-3 py-1 mt-2 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-[10px] text-indigo-300 font-extrabold uppercase tracking-[0.25em]">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping mr-2"></span> Computer Based Test System
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-1 rounded-xl bg-slate-900/90 p-1.5 text-[10px] font-bold uppercase mb-6 shadow-inner border border-slate-800">
                    <button id="tab-siswa-btn" onclick="window.switchLoginRole('siswa')" class="py-2.5 rounded-lg bg-indigo-600 text-white shadow-lg tracking-wider transition-all">Siswa</button>
                    <button id="tab-pengawas-btn" onclick="window.switchLoginRole('pengawas')" class="py-2.5 rounded-lg text-slate-400 hover:text-slate-200 tracking-wider transition-all">Pengawas</button>
                    <button id="tab-admin-btn" onclick="window.switchLoginRole('admin')" class="py-2.5 rounded-lg text-slate-400 hover:text-slate-200 tracking-wider transition-all">Admin</button>
                </div>

                <form id="siswa-login-form" onsubmit="window.handleSiswaLogin(event)" class="space-y-4 text-left">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1"><i class="fa-solid fa-id-card text-indigo-400 mr-1.5"></i> Username / NIS</label>
                        <input type="text" id="siswa-nomor" required class="w-full px-4 py-3.5 rounded-xl glass-input text-sm font-mono tracking-widest placeholder-slate-600" placeholder="Ketik username Anda...">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1"><i class="fa-solid fa-key text-indigo-400 mr-1.5"></i> Password</label>
                        <input type="password" id="siswa-password" required class="w-full px-4 py-3.5 rounded-xl glass-input text-sm font-mono tracking-widest placeholder-slate-600" placeholder="123456 atau NIS">
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full py-4 gradient-btn text-white font-black rounded-xl text-[11px] uppercase tracking-[0.15em] shadow-xl shadow-indigo-600/30 flex items-center justify-center space-x-2">
                            <span>Masuk Ujian</span> <i class="fa-solid fa-arrow-right"></i>
                        </button>
                        <div class="mt-4 text-center text-[10px] text-slate-500 font-medium tracking-widest lowercase">&copy; 2026 copyright: <span class="font-bold text-indigo-400">@yudh82</span></div>
                    </div>
                </form>

                <form id="pengawas-login-form" onsubmit="window.handlePengawasLogin(event)" class="space-y-4 text-left hidden">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1"><i class="fa-solid fa-user-tie text-emerald-400 mr-1.5"></i> Nama Pengawas</label>
                        <input type="text" id="pengawas-nama" required placeholder="Nama Lengkap & Gelar" class="w-full px-4 py-3.5 rounded-xl glass-input text-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1"><i class="fa-solid fa-door-open text-emerald-400 mr-1.5"></i> Ruang Ujian</label>
                        <select id="pengawas-ruang" required class="w-full px-4 py-3.5 rounded-xl glass-input text-sm bg-slate-900 cursor-pointer">
                            <script>
                                for(let i=1;i<=31;i++) document.write(`<option value="Ruang ${String(i).padStart(3,'0')}">Ruang ${String(i).padStart(3,'0')}</option>`);
                                document.write(`<option value="Ruang Labkom">Ruang Labkom</option>`);
                            </script>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1"><i class="fa-solid fa-lock text-emerald-400 mr-1.5"></i> Password Akses</label>
                        <input type="password" id="pengawas-password" required placeholder="••••••••" class="w-full px-4 py-3.5 rounded-xl glass-input text-sm font-mono tracking-widest">
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black rounded-xl text-[11px] uppercase tracking-[0.15em] shadow-xl shadow-emerald-600/30 transition flex items-center justify-center space-x-2">
                            <span>Masuk Dasbor</span> <i class="fa-solid fa-arrow-right"></i>
                        </button>
                        <div class="mt-4 text-center text-[10px] text-slate-500 font-medium tracking-widest lowercase">&copy; 2026 copyright: <span class="font-bold text-indigo-400">@yudh82</span></div>
                    </div>
                </form>

                <form id="admin-login-form" onsubmit="window.handleAdminLogin(event)" class="space-y-4 text-left hidden">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1"><i class="fa-solid fa-user-shield text-pink-400 mr-1.5"></i> Admin Username</label>
                        <input type="text" id="admin-username" required placeholder="admin" class="w-full px-4 py-3.5 rounded-xl glass-input text-sm font-mono">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-widest pl-1"><i class="fa-solid fa-key text-pink-400 mr-1.5"></i> Admin Password</label>
                        <input type="password" id="admin-password" required placeholder="••••••••" class="w-full px-4 py-3.5 rounded-xl glass-input text-sm font-mono tracking-widest">
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full py-4 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-black rounded-xl text-[11px] uppercase tracking-[0.15em] shadow-xl shadow-pink-600/30 transition flex items-center justify-center space-x-2">
                            <span>Akses Sistem</span> <i class="fa-solid fa-lock-open"></i>
                        </button>
                        <div class="mt-4 text-center text-[10px] text-slate-500 font-medium tracking-widest lowercase">&copy; 2026 copyright: <span class="font-bold text-indigo-400">@yudh82</span></div>
                    </div>
                </form>

                <!-- Tombol Instal PWA -->
                <div class="mt-6 pt-4 border-t border-slate-800/80">
                    <button onclick="window.installPWA()" class="w-full py-3 bg-slate-800/60 hover:bg-slate-700/80 text-emerald-400 border border-emerald-500/20 font-bold rounded-xl text-[10px] uppercase tracking-widest transition flex items-center justify-center space-x-2 shadow-inner">
                        <i class="fa-solid fa-mobile-screen-button text-sm mr-2"></i> <span>Instal Aplikasi ke Layar HP</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="main-app" class="hidden flex-1 flex flex-col h-full overflow-hidden bg-[#0b0f19]">
            <div id="mobile-header" class="hidden md:hidden flex justify-between items-center bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-40 shadow-md">
                <div class="flex items-center space-x-3"><div class="w-10 h-10 bg-slate-800 rounded-lg p-1 border border-slate-700 shadow-inner"><img id="mobile-logo-display" src="" class="max-w-full max-h-full object-contain mx-auto"></div><div><h2 class="font-extrabold text-white text-[11px] tracking-wider">CBT PANESA</h2><p id="mobile-user-role" class="text-[9px] text-emerald-400 font-bold uppercase tracking-widest mt-0.5">Role</p></div></div>
                <button onclick="window.toggleMobileSidebar()" class="text-slate-300 hover:text-white text-2xl transition"><i class="fa-solid fa-bars"></i></button>
            </div>
            
            <div class="flex-1 flex flex-col md:flex-row h-full overflow-hidden relative">
                <aside id="sidebar" class="absolute inset-y-0 left-0 z-50 w-64 h-full glass-card-dark border-r border-slate-800 p-5 flex-col justify-between transform -translate-x-full md:relative md:translate-x-0 hidden md:flex transition-transform duration-300 ease-in-out">
                    <div>
                        <div class="border-b border-slate-800 pb-5 mb-6 flex items-center space-x-3">
                            <div class="w-12 h-12 bg-slate-900 rounded-xl p-1.5 border border-slate-700 shadow-inner shrink-0"><img id="sidebar-logo-display" src="" class="max-w-full max-h-full object-contain mx-auto"></div>
                            <div class="overflow-hidden"><h2 id="sidebar-user-name" class="font-black text-white text-[11px] tracking-wider truncate">SMP NEGERI</h2><p id="sidebar-user-role" class="text-[9px] text-emerald-400 font-bold uppercase tracking-[0.2em] mt-1 truncate">Role</p></div>
                        </div>
                        <nav id="nav-menu" class="space-y-1.5 overflow-y-auto max-h-[60vh] pr-2 scrollbar-hide"></nav>
                    </div>
                    <div class="mt-auto pt-5 border-t border-slate-800">
                        <button onclick="window.handleLogout()" class="w-full flex items-center justify-center space-x-2 py-3.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-xl text-[10px] uppercase font-black tracking-widest transition border border-red-500/20"><i class="fa-solid fa-power-off text-sm"></i><span>Keluar Sesi</span></button>
                        <div class="mt-5 text-center text-[9px] text-slate-500 font-medium tracking-widest lowercase">&copy; 2026 copyright: <span class="font-bold text-indigo-400">@yudh82</span></div>
                    </div>
                </aside>
                <div id="mobile-sidebar-overlay" onclick="window.toggleMobileSidebar()" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden md:hidden z-40 transition-opacity"></div>
                <main class="flex-1 p-4 md:p-8 overflow-y-auto pb-12 relative z-10 w-full scrollbar-hide"><div id="content-container" class="max-w-7xl mx-auto w-full flex-1"></div></main>
            </div>
        </div>
    </div>
</body>
</html>

                        window.loadSiswaSelectMapelView(true);
                    } else if (window.currentRoute === 'siswa-mapel') {

        window.handleSiswaLogin = async function(e) {

            const password = document.getElementById('siswa-password').value.trim();
            
            const btnSubmit = e.target.querySelector('button[type="submit"]'); 
            const originalHtml = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memeriksa Data...'; 
            btnSubmit.disabled = true;

            try {
                let foundPeserta = null;
                for (let tk of ['7', '8', '9']) {
                    const db = getDb(tk); 
                    const { data, error } = await db.from('peserta').select('*').eq('username', username).maybeSingle();

                }

                if (!foundPeserta) { showNotification('Username tidak ditemukan di Database!'); btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; return; }
                
                const dbPassword = foundPeserta.password;
                if (dbPassword) {
                    if (password !== dbPassword) { showNotification('Password salah!'); btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; return; }
                } else {
                    if (password !== "123456" && password !== username) { showNotification('Password salah! (Gunakan 123456 atau Username)'); btnSubmit.innerHTML = originalHtml; btnSubmit.disabled = false; return; }
                }

        window.updateBtnHapusSoalTerpilih = function() {
            const checkedCount = document.querySelectorAll('.chk-soal:checked').length; const btn = document.getElementById('btn-hapus-soal');
            document.querySelectorAll('table').forEach(table => {
                const chks = table.querySelectorAll('.chk-soal'); const chksChecked = table.querySelectorAll('.chk-soal:checked'); const chkAll = table.querySelector('thead input[type="checkbox"]');
                if(chkAll && chks.length > 0) chkAll.checked = (chks.length === chksChecked.length);

        window.hapusSoalTerpilih = async function() {
            const checked = document.querySelectorAll('.chk-soal:checked');
            if(checked.length === 0) return;
            if(!confirm(`Yakin ingin menghapus ${checked.length} soal yang dipilih secara permanen?`)) return;

            const btn = document.getElementById('btn-hapus-soal'); const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghapus...'; btn.disabled = true;

            const toDelete = { '7': [], '8': [], '9': [] };
            checked.forEach(chk => { const parts = chk.value.split('|'); if(parts.length === 2) { toDelete[parts[1]].push(parts[0]); } });

            try {
                for (let tk of ['7', '8', '9']) {
                    if (toDelete[tk].length > 0) {
                        const db = getDb(tk); 
                        let { data, error } = await db.from('soal').delete().in('id', toDelete[tk]).select();
                        if (error) throw error;
                        
                        if ((!data || data.length < toDelete[tk].length) && db !== sbClient7) {
                            const fallback = await sbClient7.from('soal').delete().in('id', toDelete[tk]).eq('tingkat', tk).select();
                            if (fallback.error) throw fallback.error;
                            if (fallback.data) data = data ? [...data, ...fallback.data] : fallback.data;
                        }

                        if (!data || data.length === 0) throw new Error("Akses ditolak oleh Server (RLS belum dinonaktifkan).");
                    }
                }
                showNotification(`${checked.length} Soal berhasil dihapus.`); window.loadManajemenSoal(window.currentFilterTingkat, true);
            } catch(err) {
                showNotification('Gagal menghapus: ' + err.message); btn.innerHTML = originalHtml; btn.disabled = false;
                window.loadManajemenSoal(window.currentFilterTingkat, true);
            }
        };

        window.loadManajemenSoal = function(filterTingkat = 'semua', forceRefresh = false) {
            window.currentRoute = 'soal'; window.currentFilterTingkat = filterTingkat;
            let currentData = filterTingkat === 'semua' ? window.appData.soal : window.appData.soal.filter(s => String(s.tingkat) === filterTingkat);
            window.renderSoalUI(currentData, filterTingkat, !window.appData.isFetched.soal || forceRefresh);

            if (!window.appData.isFetched.soal || forceRefresh) {
                const queries = [sbClient7.from('soal').select('*')];
                if (sbClient8 !== sbClient7) queries.push(sbClient8.from('soal').select('*'));
                if (sbClient9 !== sbClient7) queries.push(sbClient9.from('soal').select('*'));

                Promise.allSettled(queries).then(results => {
                    let newData = []; results.forEach(res => { if(res.status === 'fulfilled' && res.value.data) newData.push(...res.value.data); });
                    window.appData.soal = newData; window.appData.isFetched.soal = true;
                    if (window.currentRoute === 'soal') {
                        let filtered = filterTingkat === 'semua' ? window.appData.soal : window.appData.soal.filter(s => String(s.tingkat) === filterTingkat);
                        window.renderSoalUI(filtered, filterTingkat, false);
                    }
                });
            }
        };

        window.hapusSoal = async function(id, tingkat, e) { 
            if(confirm("Hapus soal ini?")) { 
                const btn = e ? e.currentTarget : null; const ori = btn ? btn.innerHTML : ''; if(btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; 
                try { 
                    let db = getDb(tingkat); 
                    let { data, error } = await db.from('soal').delete().eq('id', id).select(); 
                    if(error) throw error; 
                    
                    if ((!data || data.length === 0) && db !== sbClient7) {
                        const fallback = await sbClient7.from('soal').delete().eq('id', id).eq('tingkat', tingkat).select();
                        data = fallback.data; error = fallback.error; if (error) throw error;
                    }

                    if(!data || data.length === 0) throw new Error("Akses ditolak oleh Server (RLS).");
                    window.loadManajemenSoal(window.currentFilterTingkat, true); 
                    showNotification('Soal berhasil dihapus.'); 
                } catch(err){ 
                    showNotification('Gagal Menghapus: ' + err.message); 
                    if(btn) btn.innerHTML = ori; 
                    window.loadManajemenSoal(window.currentFilterTingkat, true); 
                } 
            } 
        };

        window.loadSiswaSelectMapelView = async function(isPopState = false) {
            window.currentRoute = 'siswa-mapel'; window.isExamActive = false; const container = document.getElementById('content-container');
            if (!isPopState) history.pushState({ page: 'siswa-mapel' }, '', '#siswa-mapel');
            
            document.getElementById('login-view').classList.add('hidden'); document.getElementById('main-app').classList.remove('hidden'); document.getElementById('sidebar').classList.add('hidden'); document.getElementById('mobile-header').classList.add('hidden');
            container.innerHTML = `<div class="flex flex-col items-center justify-center h-64 text-indigo-500"><i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3"></i><p class="text-sm font-bold text-slate-400 uppercase tracking-widest">Memuat Jadwal Server...</p></div>`;
            try { const db = getDb(window.currentUser.tingkat); const { data } = await db.from('jadwal').select('*').eq('tingkat', window.currentUser.tingkat).eq('status', 'Aktif'); window.appData.jadwal = data || []; } catch(e) { window.appData.jadwal = []; }

            let html = `<div class="max-w-xl mx-auto space-y-6 mt-6 md:mt-12"><div class="glass-card-dark p-6 md:p-10 rounded-3xl border border-slate-800 shadow-2xl relative overflow-hidden text-center"><div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div><div class="w-16 h-16 bg-indigo-500/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-3xl font-bold border border-indigo-500/30 mb-4 shadow-inner"><i class="fa-solid fa-book-open"></i></div><h2 class="text-2xl font-extrabold text-white mb-1">Pilih Ujian</h2><p class="text-xs text-slate-400 mb-6">Halo, <b class="text-indigo-300 font-bold uppercase">${window.currentUser.nama}</b> (Kelas ${window.currentUser.kelas}).<br>Silakan pilih mata pelajaran yang aktif saat ini.</p><div class="space-y-3 text-left">`;
            if(window.appData.jadwal.length === 0) { html += `<div class="p-6 bg-slate-900 rounded-2xl text-center text-slate-400 font-medium border border-slate-800 text-sm">Belum ada jadwal ujian yang berstatus <b>Aktif</b> untuk Kelas ${window.currentUser.tingkat}.</div>`; } 
            else { window.appData.jadwal.forEach(j => { html += `<button onclick="window.proceedToConfirmation('${j.mapel}')" class="w-full flex items-center justify-between p-4 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500/50 transition-all group shadow-md"><div class="flex items-center space-x-3 text-left"><div class="w-10 h-10 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold text-sm group-hover:bg-indigo-600 group-hover:text-white transition"><i class="fa-solid fa-file-lines"></i></div><div><div class="font-extrabold text-white text-sm group-hover:text-indigo-300 transition">${j.mapel}</div><div class="text-[10px] text-slate-400 mt-0.5"><i class="fa-regular fa-clock mr-1"></i>Durasi: ${j.durasi || 90} Menit</div></div></div><i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-white transition transform group-hover:translate-x-1"></i></button>`; }); }
            html += `</div><div class="mt-8 pt-4 border-t border-slate-800"><button onclick="window.handleLogout()" class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs uppercase tracking-wider transition w-full md:w-auto">Keluar / Kembali</button></div></div></div>`;
            container.innerHTML = html;
        };

        window.proceedToConfirmation = function(mapel) { window.currentUser.mapel = mapel; window.loadSiswaUjianView(); };
        
        window.loadSiswaUjianView = function(isPopState = false) {
            window.currentRoute = 'siswa-konfirmasi'; window.isExamActive = false; const container = document.getElementById('content-container');

            container.innerHTML = `<div class="max-w-3xl mx-auto space-y-6 mt-4 md:mt-10"><div class="glass-card-dark p-6 md:p-10 rounded-3xl border border-slate-800 text-center shadow-2xl relative"><div class="w-20 h-20 bg-indigo-500/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-4xl mb-4"><i class="fa-solid fa-laptop-code"></i></div><h2 class="text-2xl md:text-3xl font-extrabold text-white">Konfirmasi Identitas</h2><div class="bg-slate-900 p-6 rounded-2xl border border-slate-700 text-left text-sm space-y-4 max-w-md mx-auto my-8 shadow-inner"><div class="flex flex-col sm:flex-row sm:justify-between border-b border-slate-800 pb-3 gap-1"><span class="text-slate-400 font-bold uppercase text-[10px] sm:text-xs">Username</span> <span class="font-bold text-indigo-400 font-mono text-base">${window.currentUser.nomor}</span></div><div class="flex flex-col sm:flex-row sm:justify-between border-b border-slate-800 pb-3 gap-1"><span class="text-slate-400 font-bold uppercase text-[10px] sm:text-xs">Nama Lengkap</span> <span class="font-extrabold text-white text-base">${window.currentUser.nama}</span></div><div class="flex flex-col sm:flex-row sm:justify-between border-b border-slate-800 pb-3 gap-1"><span class="text-slate-400 font-bold uppercase text-[10px] sm:text-xs">Kelas & Tingkat</span> <span class="font-bold text-slate-200 text-base">${window.currentUser.kelas} (Tk. ${window.currentUser.tingkat})</span></div><div class="flex flex-col sm:flex-row sm:justify-between gap-1"><span class="text-slate-400 font-bold uppercase text-[10px] sm:text-xs">Mata Pelajaran</span> <span class="font-black text-emerald-400 text-base">${window.currentUser.mapel}</span></div></div><div class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto"><button onclick="window.loadSiswaSelectMapelView(true)" class="w-full sm:w-1/3 py-4 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition">Kembali</button><button onclick="window.mulaiKerjakanUjian(this)" class="w-full sm:w-2/3 py-4 gradient-btn text-white font-extrabold rounded-xl uppercase tracking-widest text-xs shadow-xl"><i class="fa-solid fa-play mr-2"></i> Mulai Kerjakan</button></div></div></div>`;
        };
    </script>
